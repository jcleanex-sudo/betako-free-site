name: Update BETAKO predictions

on:
  schedule:
    # Pre-run so the public data is normally ready by 08:15 JST even when
    # GitHub's scheduled runner starts late.
    - cron: "45 22 * * *"
    # 08:15 JST fallback refresh for late official data.
    - cron: "15 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: betako-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOATRACE_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/evaluate_results.py
      - run: python scripts/generate_predictions.py
      - name: Save prediction data
        run: |
          git config user.name "betako-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update daily predictions"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Initialize today's exhibition data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-exhibition.yml --ref main
