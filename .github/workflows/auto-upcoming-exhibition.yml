name: Auto update upcoming BETAKO races

on:
  schedule:
    # 07:00–20:55 JST. Start early; only the nearest unfinished race per venue is refreshed.
    - cron: "*/5 22-23,0-11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betako-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOATRACE_EXHIBITION_WORKERS: "4"
      AUTO_SCHEDULE_WORKERS: "4"
      AUTO_MIN_REMAINING_MINUTES: "6"
      AUTO_LOOKAHEAD_MINUTES: "35"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_upcoming_exhibition.py
      - name: Save automatic exhibition data
        run: |
          git config user.name "betako-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exhibition.json
          git diff --cached --quiet || git commit -m "Auto update upcoming race predictions"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
