name: Update exhibition predictions

on:
  workflow_dispatch:
    inputs:
      venue_id:
        description: Optional two-digit venue id for one-race refresh
        required: false
        default: ""
      race:
        description: Optional race number for one-race refresh
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: betako-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_VENUE_ID: ${{ inputs.venue_id }}
      TARGET_RACE: ${{ inputs.race }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_exhibition.py
      - name: Save exhibition data
        run: |
          git config user.name "betako-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exhibition.json
          git diff --cached --quiet || git commit -m "Update exhibition predictions"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 3
          done
          exit 1
      - name: Request site publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
