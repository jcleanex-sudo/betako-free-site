name: Update BETAKO intraday results

on:
  schedule:
    # 09:17–21:17 JST. Completed races only; pending races remain excluded.
    - cron: "17 0-12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: betako-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/evaluate_results.py --today-venues
      - name: Save completed results
        run: |
          git config user.name "betako-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/performance.json
          git diff --cached --quiet || git commit -m "Update intraday venue results"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Request site publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
